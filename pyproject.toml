[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "kairos-quant-scouts"
version = "0.1.0"
description = "Kairos Layer 1A — pure-math market data collectors and indicators."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "TheLitis" }]
dependencies = [
    "aiohttp>=3.10,<4",
    "kairos-core>=0.3,<0.4",
    "kairos-persistence>=0.1,<0.2",
    "numpy>=1.26,<3",
]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "build>=1.2,<2",
    "mypy>=1.10,<3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.16,<0.17",
]

[tool.uv]
required-version = "==0.12.3"

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "a4f427cdd44184fac62a842320133ac5a3e11fbe" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "e36a3c01aa8aa3847bfbc8fa42eb4f98794d28a5" }

[project.scripts]
kairos-quant-scouts = "kairos_quant.service:main"
kairos-venue-compare = "kairos_quant.venue_comparison:main"

[tool.hatch.build.targets.wheel]
packages = ["kairos_quant"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
